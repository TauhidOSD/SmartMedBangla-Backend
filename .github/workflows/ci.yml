name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartmed_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartmed_ci
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CLIENT_URL: http://localhost:3000
      ENABLE_JOBS: "false"
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API smoke test
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
          curl -sf http://localhost:5000/api/health | grep -q '"database":"up"'
          # Protected route must refuse anonymous access
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/auth/me)" = "401"
          # Validation must reject a bad registration
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"bad"}' http://localhost:5000/api/auth/register)" = "400"
